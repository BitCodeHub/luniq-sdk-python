name: release
# SBOM + cosign on every PyPI release.
# Closes Phase 2.2 + Phase 2.3 of the 2026-05-05 SOC 2 Type II remediation roadmap.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install build

      - name: Generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft dir:. -o cyclonedx-json=sbom-${{ github.ref_name }}.json

      - run: python -m build

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts
        run: |
          for f in dist/* sbom-${{ github.ref_name }}.json; do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            dist/*.sig
            dist/*.pem
            sbom-${{ github.ref_name }}.json
            sbom-${{ github.ref_name }}.json.sig
            sbom-${{ github.ref_name }}.json.pem
